name: Auto Sign In

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到
        env:
          DS_TOKEN: ${{ secrets.DS_TOKEN }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
        run: python sign.py
